name: adhan_prayer_salah_times
description: "Adhan Prayer Times App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🔔 Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # 📍 Location
  geolocator: ^9.0.2
  geocoding: ^2.2.0
  # 🌐 API
  http: ^1.1.0

  # 🌍 Date / formatting
  intl: ^0.20.2

  # 💾 Local storage (OFFLINE SUPPORT)
  shared_preferences: ^2.3.5

  # 🌐 Internet detection (OFFLINE BANNER)
  connectivity_plus: ^6.0.5

  # 🍎 UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/